name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR-Image-Pfade muessen vollstaendig kleingeschrieben sein.
  IMAGE_NAME: nexusmeister/nexknx.oiltankwatcher

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7
        with:
          # Volle Historie (inkl. Tags) wird von GitVersion benoetigt, um
          # die Version aus dem letzten Tag + Commit-Abstand zu berechnen.
          fetch-depth: 0

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: GitVersion einrichten
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"

      - name: Version aus Git-Historie ermitteln
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Wiederherstellen
        run: dotnet restore

      - name: Bauen
        run: >-
          dotnet build --configuration Release --no-restore
          -p:Version=${{ steps.gitversion.outputs.semVer }}
          -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Testen
        run: >-
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --settings tests/NexKnx.OilTankWatcher.Tests/coverlet.runsettings
          --results-directory ./coverage

      - name: Testergebnisse veroeffentlichen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          retention-days: 7

      - name: Testergebnisse in Job-Summary anzeigen
        if: always()
        uses: dorny/test-reporter@4a2e97665d5fa767581ef38eca97b9694bd4eef4 # v2
        with:
          name: Testergebnisse
          path: "**/test-results.trx"
          reporter: dotnet-trx

      - name: Code-Coverage-Bericht erzeugen
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: "coverage/**/coverage.cobertura.xml"
          targetdir: "coverage-report"
          reporttypes: "MarkdownSummaryGithub;Html"

      - name: Code Coverage in Job-Summary veroeffentlichen
        if: always()
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Code-Coverage-Bericht veroeffentlichen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
          retention-days: 7

  dependency-scan:
    name: Trivy Abhaengigkeits-Scan
    # Laeuft immer (PR und Push auf main), damit verwundbare Abhaengigkeiten
    # schon vor dem Merge auffallen.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Abhaengigkeiten scannen (Dateisystem)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          output: trivy-dependencies.txt
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Scan-Ergebnisse in Job-Summary veroeffentlichen
        if: always()
        run: |
          echo '## Trivy Abhaengigkeits-Scan' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-dependencies.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  sonarcloud:
    name: SonarCloud-Analyse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7
        with:
          # SonarCloud braucht die volle Historie fuer Blame-Informationen.
          fetch-depth: 0

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: JDK einrichten (fuer den SonarScanner)
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "zulu"

      - name: SonarScanner-Cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarScanner installieren
        run: dotnet tool install --global dotnet-sonarscanner

      - name: GitVersion einrichten
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"

      - name: Version aus Git-Historie ermitteln
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: SonarScanner-Analyse starten
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # SONAR_TOKEN wird vom Scanner automatisch aus der Umgebungsvariable
        # gelesen - bewusst nicht per ${{ secrets.SONAR_TOKEN }} in das
        # run-Skript expandiert (siehe GitHub-Issue #24, Sonar-Regel S7636).
        run: >-
          dotnet-sonarscanner begin
          /k:"Nexusmeister_NexKnx.OilTankWatcher"
          /o:"nexusmeister"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Wiederherstellen
        run: dotnet restore

      - name: Bauen
        run: >-
          dotnet build --configuration Release --no-restore
          -p:Version=${{ steps.gitversion.outputs.semVer }}
          -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Testen (fuer Coverage-Daten)
        run: >-
          dotnet test --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --settings tests/NexKnx.OilTankWatcher.Tests/coverlet.runsettings
          --results-directory ./coverage

      - name: SonarScanner-Analyse abschliessen
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end

  docker:
    name: Docker Image bauen, scannen & veroeffentlichen
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: QEMU einrichten (fuer arm64-Cross-Build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Nur bei einem tatsaechlichen Push auf main (= abgeschlossene PR)
      # bei der GitHub Container Registry anmelden und danach pushen.
      # Bei Pull Requests wird das Image nur gebaut, nicht veroeffentlicht.
      - name: Bei GitHub Container Registry anmelden
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten (Tags/Labels) ermitteln
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.build-test.outputs.semVer }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Image bauen (und bei main veroeffentlichen)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/NexKnx.OilTankWatcher/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.build-test.outputs.semVer }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Eigenstaendiger Single-Arch-Build, lokal in den Docker-Daemon geladen,
      # damit das Image auch bei PRs (ohne Registry-Push) gescannt werden kann.
      - name: Image fuer den Scan lokal bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/NexKnx.OilTankWatcher/Dockerfile
          platforms: linux/amd64
          load: true
          tags: trivy-scan-target:${{ needs.build-test.outputs.semVer }}
          build-args: |
            VERSION=${{ needs.build-test.outputs.semVer }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image scannen
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: trivy-scan-target:${{ needs.build-test.outputs.semVer }}
          format: table
          output: trivy-image.txt
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Image-Scan-Ergebnisse in Job-Summary veroeffentlichen
        if: always()
        run: |
          echo '## Trivy Image-Scan' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-image.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
