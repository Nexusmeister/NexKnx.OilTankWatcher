name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR image paths must be fully lowercase.
  IMAGE_NAME: nexusmeister/nexknx.oiltankwatcher

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # Full history (including tags) is required by GitVersion to
          # compute the version from the last tag + commit distance.
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"

      - name: Determine version from Git history
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >-
          dotnet build --configuration Release --no-restore
          -p:Version=${{ steps.gitversion.outputs.semVer }}
          -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Test
        run: >-
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --settings tests/NexKnx.OilTankWatcher.Tests/coverlet.runsettings
          --results-directory ./coverage

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          retention-days: 7

      - name: Show test results in job summary
        if: always()
        uses: dorny/test-reporter@4a2e97665d5fa767581ef38eca97b9694bd4eef4 # v2
        with:
          name: Test results
          path: "**/test-results.trx"
          reporter: dotnet-trx

      - name: Generate code coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: "coverage/**/coverage.cobertura.xml"
          targetdir: "coverage-report"
          reporttypes: "MarkdownSummaryGithub;Html"

      - name: Publish code coverage in job summary
        if: always()
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish code coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
          retention-days: 7

  dependency-scan:
    name: Trivy dependency scan
    # Always runs (PR and push to main), so vulnerable dependencies are
    # already flagged before the merge.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Scan dependencies (filesystem)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          output: trivy-dependencies.txt
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Publish scan results in job summary
        if: always()
        run: |
          echo '## Trivy dependency scan' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-dependencies.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # SonarCloud needs the full history for blame information.
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up JDK (for the SonarScanner)
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "zulu"

      - name: SonarScanner cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"

      - name: Determine version from Git history
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Start SonarScanner analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # SONAR_TOKEN is read automatically by the scanner from the
        # environment variable - deliberately not expanded via
        # ${{ secrets.SONAR_TOKEN }} into the run script (see GitHub issue
        # #24, Sonar rule S7636). sonar.coverage.exclusions mirrors the same
        # exceptions already justified in coverlet.runsettings (issue #10) -
        # without these, SonarCloud would otherwise count files not tested
        # locally as 0% instead of excluding them from the calculation.
        run: >-
          dotnet-sonarscanner begin
          /k:"Nexusmeister_NexKnx.OilTankWatcher"
          /o:"nexusmeister"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.coverage.exclusions="src/NexKnx.OilTankWatcher/Program.cs,src/NexKnx.OilTankWatcher/Knx/FalconKnxGateway.cs,aspire/NexKnx.OilTankWatcher.AppHost/AppHost.cs,aspire/NexKnx.OilTankWatcher.ServiceDefaults/Extensions.cs"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >-
          dotnet build --configuration Release --no-restore
          -p:Version=${{ steps.gitversion.outputs.semVer }}
          -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Test (for coverage data)
        run: >-
          dotnet test --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --settings tests/NexKnx.OilTankWatcher.Tests/coverlet.runsettings
          --results-directory ./coverage

      - name: Finish SonarScanner analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end

  docker:
    name: Build, scan & publish Docker image
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Only log in to the GitHub Container Registry and push afterwards on
      # an actual push to main (= a completed PR). On pull requests the
      # image is only built, not published.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.build-test.outputs.semVer }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (and publish on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/NexKnx.OilTankWatcher/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.build-test.outputs.semVer }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Standalone single-arch build, loaded locally into the Docker daemon,
      # so the image can also be scanned on PRs (without a registry push).
      - name: Build image locally for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/NexKnx.OilTankWatcher/Dockerfile
          platforms: linux/amd64
          load: true
          tags: trivy-scan-target:${{ needs.build-test.outputs.semVer }}
          build-args: |
            VERSION=${{ needs.build-test.outputs.semVer }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: trivy-scan-target:${{ needs.build-test.outputs.semVer }}
          format: table
          output: trivy-image.txt
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Publish image scan results in job summary
        if: always()
        run: |
          echo '## Trivy image scan' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-image.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Only on an actual push to main: bump the pinned image tag that the
      # Pi deploys, in the separate NexInfra repo. That repo's self-hosted
      # runner workflow picks up the resulting commit automatically.
      - name: Bump oiltank-watcher image tag in NexInfra
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.NEXINFRA_PUSH_TOKEN }}
        run: |
          set -eu
          SHA_TAG="sha-$(git rev-parse --short HEAD)"

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/Nexusmeister/NexInfra.git" nexinfra
          cd nexinfra

          sed -i -E "s#(ghcr\.io/nexusmeister/nexknx\.oiltankwatcher:)[A-Za-z0-9._-]+#\1${SHA_TAG}#" oiltank/docker-compose.yml

          if git diff --quiet; then
            echo "NexInfra already pinned to ${SHA_TAG}; nothing to do."
            exit 0
          fi

          git config user.name "nexknx-ci"
          git config user.email "ci@nexknx.local"
          git add oiltank/docker-compose.yml
          git commit -m "Bump oiltank-watcher image to ${SHA_TAG}

Automated bump triggered by Nexusmeister/NexKnx.OilTankWatcher@${{ github.sha }}."
          git push
