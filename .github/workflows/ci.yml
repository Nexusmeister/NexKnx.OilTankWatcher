name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR-Image-Pfade muessen vollstaendig kleingeschrieben sein.
  IMAGE_NAME: nexusmeister/nexknx.oiltankwatcher

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7
        with:
          # Volle Historie (inkl. Tags) wird von GitVersion benoetigt, um
          # die Version aus dem letzten Tag + Commit-Abstand zu berechnen.
          fetch-depth: 0

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: GitVersion einrichten
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.x"

      - name: Version aus Git-Historie ermitteln
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Wiederherstellen
        run: dotnet restore

      - name: Bauen
        run: >-
          dotnet build --configuration Release --no-restore
          -p:Version=${{ steps.gitversion.outputs.semVer }}
          -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Testen
        run: >-
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Testergebnisse veroeffentlichen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          retention-days: 7

      - name: Testergebnisse in Job-Summary anzeigen
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Testergebnisse
          path: "**/test-results.trx"
          reporter: dotnet-trx

      - name: Code-Coverage-Bericht erzeugen
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: "coverage/**/coverage.cobertura.xml"
          targetdir: "coverage-report"
          reporttypes: "MarkdownSummaryGithub;Html"

      - name: Code Coverage in Job-Summary veroeffentlichen
        if: always()
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Code-Coverage-Bericht veroeffentlichen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
          retention-days: 7

  docker:
    name: Docker Image bauen & veroeffentlichen
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: QEMU einrichten (fuer arm64-Cross-Build)
        uses: docker/setup-qemu-action@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      # Nur bei einem tatsaechlichen Push auf main (= abgeschlossene PR)
      # bei der GitHub Container Registry anmelden und danach pushen.
      # Bei Pull Requests wird das Image nur gebaut, nicht veroeffentlicht.
      - name: Bei GitHub Container Registry anmelden
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten (Tags/Labels) ermitteln
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.build-test.outputs.semVer }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Image bauen (und bei main veroeffentlichen)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/NexKnx.OilTankWatcher/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.build-test.outputs.semVer }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
