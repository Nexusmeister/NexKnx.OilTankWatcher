# Every commit on main automatically gets a new, full SemVer version number
# (no pre-release suffix) - without having to manually set a Git tag for it.
# The first version is fixed by the tag v0.1.0; after that GitVersion
# automatically increments the patch part per commit on main (see the
# GitVersion docs, branch default for main: increment: Patch).
mode: ContinuousDeployment
