services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: oiltank-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  oiltank-watcher:
    build:
      context: .
      dockerfile: src/NexKnx.OilTankWatcher/Dockerfile
    container_name: oiltank-watcher
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - history-data:/data
    # KNX IP routing uses multicast (224.0.23.12) and usually requires the
    # host network mode on the Pi, since Docker bridge networks don't
    # forward multicast by default. For IP tunneling (default) the normal
    # bridge network is sufficient, as long as the KNX/IP interface is
    # reachable from the container.
    # network_mode: host
    environment:
      # MQTT
      - Mqtt__Host=mosquitto
      - Mqtt__Port=1883
      - Mqtt__Topic=oiltank/main/value

      # Tank
      - Tank__NominalVolumeLiters=9100
      - Tank__MaxStepPercent=5
      - Tank__MedianWindowSize=5

      # KNX - make sure to run with a free test group address first (see
      # README), before entering real GAs!
      - Knx__ConnectionType=Tunneling
      - Knx__Tunneling__Host=192.168.178.21
      - Knx__Tunneling__Port=3671
      # true, because the container on the Docker bridge network reports a
      # private address to the KNX interface that isn't reachable from the
      # LAN - the KNX interface must instead reply to the observed sender
      # address (classic NAT traversal for KNXnet/IP tunneling).
      - Knx__Tunneling__UseNat=true
      - Knx__GroupAddresses__PercentLevel=10/3/0
      - Knx__GroupAddresses__LitersLevel=10/3/1
      - Knx__GroupAddresses__WarningBit=10/3/2
      - Knx__GroupAddresses__FaultBit=10/3/2
      - Knx__GroupAddresses__RuntimeDays=10/3/1
      - Knx__WarningThresholdPercent=25
      - Knx__WarningRecoveryPercent=28
      - Knx__FaultAfterHours=12
      - Knx__SendIntervalMinutes=10
      - Knx__ChangeThresholdPercent=0.5

      - RuntimeEstimation__Enabled=true
      - RuntimeEstimation__HistoryDays=30
      - RuntimeEstimation__MinimumSamples=5
      - RuntimeEstimation__DatabasePath=/data/history.db

      # Send logs/metrics/traces to the Grafana stack via OTLP. Each signal
      # has its own backend (logs -> Loki, metrics -> Prometheus,
      # traces -> Tempo). The actual hosts/ports are deployment-specific and
      # therefore come from the .env file (see .env.example) instead of
      # being hardcoded in the repo. If a variable is unset, it stays empty
      # and the respective OTLP export is automatically disabled (see
      # AddOpenTelemetryExporters in Extensions.cs).
      - OTEL_SERVICE_NAME=oiltank-watcher
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}

volumes:
  mosquitto-data:
  history-data:
